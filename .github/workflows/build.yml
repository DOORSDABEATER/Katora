
name: Build Xarvoth

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q "xarvoth-plugin.zip"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        working-directory: xarvoth
        run: mvn -B -ntp clean package

      - name: Package resource pack
        working-directory: xarvoth
        run: zip -qr ../Xarvoth-ResourcePack.zip resourcepack

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Xarvoth-JAR
          path: xarvoth/target/*.jar
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: Xarvoth-ResourcePack
          path: Xarvoth-ResourcePack.zip
          if-no-files-found: error
          
